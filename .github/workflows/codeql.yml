name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: write
  security-events: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix dashboard layout
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          start = text.find('function Dashboard({ data, usage, openForm }:')
          end = text.find('\nfunction PlansPage(', start)
          if start < 0 or end < 0:
              raise SystemExit('Dashboard boundaries not found; refusing unsafe rewrite')

          new_dashboard = '''function Dashboard({ data, usage, openForm: _openForm }: { data: CloudData; usage: UsageSummary; openForm: (resource: Resource) => void }) {
  return <>
    <AthleteCommandCenter data={data} />
    <section className="dashboard-secondary">
      <div className="grid two dashboard-secondary-grid">
        <section className="card panel dashboard-ai-usage">
          <div className="section-heading"><div><span className="eyebrow">AI</span><h3>AI usage</h3></div><Sparkles size={18} /></div>
          <Stat icon={Sparkles} label="AI usage" value={`${usage.used}/${usage.limit}`} note={usage.plan.name} />
        </section>
        <section className="card panel dashboard-weight-trend">
          <div className="section-heading"><div><span className="eyebrow">Progress</span><h3>Weight trend</h3></div><Weight size={18} /></div>
          <div className="dashboard-chart-wrap">
            <ResponsiveContainer width="100%" height={260}>
              <LineChart data={data.weights} margin={{ top: 8, right: 12, left: 0, bottom: 8 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#25405f" />
                <XAxis dataKey="logged_at" tick={{ fontSize: 11 }} minTickGap={20} />
                <YAxis width={42} />
                <Tooltip />
                <Line type="monotone" dataKey="weight_kg" stroke="#49d7ff" strokeWidth={3} dot={{ r: 3 }} activeDot={{ r: 5 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </section>
      </div>
    </section>
  </>;
}'''
          text = text[:start] + new_dashboard + text[end:]
          app.write_text(text)

          css = Path('src/styles/main.css')
          styles = css.read_text()
          marker = '/* ATHLETEOS_LOWER_DASHBOARD_FIX_V2 */'
          if marker not in styles:
              styles += '''\n\n/* ATHLETEOS_LOWER_DASHBOARD_FIX_V2 */\n.dashboard-secondary, .dashboard-secondary-grid, .dashboard-secondary-grid > * { min-width: 0; }\n.dashboard-secondary { width: 100%; margin-top: 18px; }\n.dashboard-secondary-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; }\n.dashboard-ai-usage, .dashboard-weight-trend { min-width: 0; overflow: hidden; }\n.dashboard-ai-usage .metric { margin: 0; width: 100%; }\n.dashboard-chart-wrap { width: 100%; min-width: 0; overflow: hidden; }\n.dashboard-chart-wrap .recharts-responsive-container { max-width: 100%; min-width: 0 !important; }\n@media (max-width: 900px) { .dashboard-secondary-grid { grid-template-columns: 1fr; } }\n'''
          css.write_text(styles)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v3
      - name: Commit dashboard fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles/main.css
          git commit -m "fix lower dashboard and preserve interactive command center"
          git push
