name: Fix upload storage flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upload fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old_fields = '''    verifications: [["document_type", "Proof type", "select", ["school_id", "fee_receipt", "bonafide"]], ["file_path", "Storage file path"], ["status", "Status", "select", ["pending", "approved", "rejected"]]]'''
          new_fields = '''    verifications: [["document_type", "Proof type", "select", ["school_id", "fee_receipt", "bonafide"]]]'''
          if old_fields not in text:
              raise SystemExit('verification fields pattern not found')
          text = text.replace(old_fields, new_fields, 1)

          old_submit = '''      const payload = { ...values };\n      if (form.resource === "documents" && file) {\n        if (!userId) throw new Error("Please sign in again before uploading.");\n        const extension = file.name.includes(".") ? file.name.split(".").pop() : "bin";\n        const safeName = `${crypto.randomUUID()}.${extension}`;\n        payload.file_path = await uploadPrivateFile("documents", `${userId}/${safeName}`, file);\n      }\n      await save(form.resource, payload);'''
          new_submit = '''      const payload = { ...values };\n      if (form.resource === "documents" || form.resource === "verifications") {\n        if (!userId) throw new Error("Please sign in again before uploading.");\n        if (!file) throw new Error("Please choose a document to upload.");\n        if (file.size > 5 * 1024 * 1024) throw new Error("The selected file must be 5 MB or smaller.");\n        const extension = file.name.includes(".") ? file.name.split(".").pop()?.toLowerCase() : "bin";\n        const safeName = `${crypto.randomUUID()}.${extension || "bin"}`;\n        const bucket = form.resource === "verifications" ? "verification-proofs" : "documents";\n        payload.file_path = await uploadPrivateFile(bucket, `${userId}/${safeName}`, file);\n        if (form.resource === "verifications") payload.status = "pending";\n      }\n      await save(form.resource, payload);'''
          if old_submit not in text:
              raise SystemExit('upload submit pattern not found')
          text = text.replace(old_submit, new_submit, 1)

          old_render = '''{form.resource === "documents" && <label className="field"><span>Upload file</span><input type="file" onChange={(event) => setFile(event.target.files?.[0] || null)} /></label>}'''
          new_render = '''{(form.resource === "documents" || form.resource === "verifications") && <label className="field"><span>Upload file (max 5 MB)</span><input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" required onChange={(event) => setFile(event.target.files?.[0] || null)} /></label>}'''
          if old_render not in text:
              raise SystemExit('upload input pattern not found')
          text = text.replace(old_render, new_render, 1)
          app.write_text(text)

          db = Path('src/services/database.ts')
          text = db.read_text()
          old_limit = '  if (file.size > 10 * 1024 * 1024) throw new Error("The selected file must be 10 MB or smaller.");'
          new_limit = '  if (file.size > 5 * 1024 * 1024) throw new Error("The selected file must be 5 MB or smaller.");'
          if old_limit not in text:
              raise SystemExit('database upload limit pattern not found')
          db.write_text(text.replace(old_limit, new_limit, 1))

          storage = Path('supabase/storage.sql')
          text = storage.read_text()
          old_buckets = """insert into storage.buckets (id, name, public)\nvalues\n  ('profile-images', 'profile-images', false),\n  ('medal-images', 'medal-images', false),\n  ('certificates', 'certificates', false),\n  ('documents', 'documents', false),\n  ('verification-proofs', 'verification-proofs', false),\n  ('academy-media', 'academy-media', false)\non conflict (id) do update set public = excluded.public;"""
          new_buckets = """insert into storage.buckets (id, name, public, file_size_limit)\nvalues\n  ('profile-images', 'profile-images', false, 5242880),\n  ('medal-images', 'medal-images', false, 5242880),\n  ('certificates', 'certificates', false, 5242880),\n  ('documents', 'documents', false, 5242880),\n  ('verification-proofs', 'verification-proofs', false, 5242880),\n  ('academy-media', 'academy-media', false, 5242880)\non conflict (id) do update set public = excluded.public, file_size_limit = excluded.file_size_limit;"""
          if old_buckets not in text:
              raise SystemExit('storage bucket pattern not found')
          storage.write_text(text.replace(old_buckets, new_buckets, 1))

          migration = Path('supabase/migrations/20260912_upload_size_limit.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text("""update storage.buckets\nset file_size_limit = 5242880\nwhere id in ('documents', 'verification-proofs');\n""")

      - name: Commit fixes and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/database.ts supabase/storage.sql supabase/migrations/20260912_upload_size_limit.sql .github/workflows/fix-upload-storage.yml
          git rm .github/workflows/fix-upload-storage.yml
          git commit -m "fix uploads for documents and verification proofs"
          git push
