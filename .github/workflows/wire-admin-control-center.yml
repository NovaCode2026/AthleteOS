name: Wire Admin Control Center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-admin:
    if: contains(github.event.head_commit.message, '[admin-wire]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire AdminControlCenter
        run: node scripts/wire-admin-control-center.mjs
      - name: Build verification
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Commit verified integration
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Admin integration already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat(admin): wire admin control center [skip ci]"
          git push
