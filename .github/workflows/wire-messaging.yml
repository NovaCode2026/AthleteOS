name: Wire secure messaging

on:
  push:
    branches: [main]
    paths:
      - "src/App.tsx"
      - "src/components/messaging/**"
      - "scripts/wire-messaging.mjs"
      - ".github/workflows/wire-messaging.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/wire-messaging.mjs
      - run: pnpm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/App.tsx src/styles/main.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles/main.css
          git commit -m "feat: wire secure messaging page"
          git push
